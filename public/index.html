<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书帖子归档工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #ff2442;
      --red-light: #ff6b81;
      --bg: #f5f5f5;
      --card-bg: #fff;
      --text: #333;
      --text-light: #999;
      --border: #eee;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --green: #07c160;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      background: var(--card-bg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .navbar .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--red);
      white-space: nowrap;
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 16px 8px 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--red); }

    .search-box::before {
      content: ""; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; border: 2px solid #999; border-radius: 50%;
    }
    .search-box::after {
      content: ""; position: absolute; left: 24px; top: 64%; width: 2px; height: 6px;
      background: #999; transform: rotate(-45deg);
    }

    .nav-actions { display: flex; gap: 8px; margin-left: auto; }

    .btn {
      padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-primary { background: var(--red); color: white; }
    .btn-primary:hover { background: var(--red-light); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--red); color: var(--red); }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover { opacity: 0.9; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    .stats-bar {
      padding: 16px 24px; display: flex; gap: 24px; align-items: center;
      font-size: 14px; color: var(--text-light);
    }
    .stats-bar .count { font-weight: 600; color: var(--text); }

    .waterfall { padding: 0 24px 24px; column-count: 4; column-gap: 16px; }
    @media (max-width: 1200px) { .waterfall { column-count: 3; } }
    @media (max-width: 900px) { .waterfall { column-count: 2; } }
    @media (max-width: 600px) { .waterfall { column-count: 1; } }

    .card {
      break-inside: avoid; background: var(--card-bg); border-radius: 12px;
      overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }

    .card-image { width: 100%; display: block; background: #f0f0f0; min-height: 120px; }
    .card-image.placeholder {
      display: flex; align-items: center; justify-content: center; height: 160px;
      color: var(--text-light); font-size: 48px; background: linear-gradient(135deg, #ffeef0, #fff5f6);
    }

    .card-body { padding: 12px; }
    .card-title {
      font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-light);
    }
    .card-author { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }

    .badge-archived {
      display: inline-block; padding: 1px 6px; background: #e8faf0; color: var(--green);
      border-radius: 6px; font-size: 10px; font-weight: 600;
    }

    .card-tags { padding: 4px 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      display: inline-block; padding: 2px 8px; background: #fff0f1;
      color: var(--red); border-radius: 10px; font-size: 11px;
    }

    .card-actions { padding: 0 12px 12px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-actions { opacity: 1; }

    /* 弹窗 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg); border-radius: 16px; width: 90%; max-width: 520px;
      max-height: 90vh; overflow-y: auto; padding: 24px;
    }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .modal .form-group { margin-bottom: 12px; }
    .modal label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
    .modal input, .modal textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; outline: none; font-family: inherit;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--red); }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    .detail-modal .modal { max-width: 720px; }
    .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .detail-author { font-size: 14px; color: var(--text-light); margin-bottom: 16px; }
    .detail-content { font-size: 15px; line-height: 1.8; margin-bottom: 16px; white-space: pre-wrap; }
    .detail-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .detail-images img { max-width: 100%; border-radius: 8px; }
    .detail-stats { display: flex; gap: 16px; font-size: 14px; color: var(--text-light); margin-bottom: 12px; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

    /* 评论区 */
    .comments-section { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
    .comments-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .comment-item { padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-time { color: var(--text-light); font-size: 11px; margin-left: 8px; }
    .comment-likes { color: var(--text-light); font-size: 11px; margin-left: 8px; }
    .comment-content { font-size: 14px; line-height: 1.6; margin-top: 4px; }
    .sub-comment { margin-left: 20px; padding: 6px 0; border-top: 1px solid #fafafa; }

    /* 进度条 */
    .progress-bar {
      display: none; background: #f0f0f0; border-radius: 8px; overflow: hidden;
      margin: 12px 0; height: 28px; position: relative;
    }
    .progress-bar.active { display: block; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--red), var(--red-light));
      transition: width 0.3s; border-radius: 8px;
    }
    .progress-text {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text);
    }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
    .empty-state p { font-size: 16px; margin-bottom: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333; color: white; padding: 10px 24px;
      border-radius: 20px; font-size: 14px; z-index: 300; transition: transform 0.3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">小红书归档</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索标题、内容、作者、标签...">
  </div>
  <div class="nav-actions">
    <button class="btn btn-success" onclick="openArchiveModal()">归档帖子</button>
    <button class="btn btn-outline" onclick="openAddModal()">手动添加</button>
  </div>
</nav>

<div class="stats-bar">
  <span>共 <b class="count" id="totalCount">0</b> 条帖子</span>
  <span>已归档 <b class="count" id="archivedCount">0</b> 条</span>
</div>

<div class="waterfall" id="postList"></div>

<div class="empty-state" id="emptyState" style="display:none;">
  <div class="icon">&#128451;</div>
  <p>还没有归档任何帖子</p>
  <div class="hint" style="font-size:14px;">点击"归档帖子"按钮，粘贴小红书链接，完整保存帖子内容</div>
</div>

<!-- 归档弹窗 -->
<div class="modal-overlay" id="archiveModal">
  <div class="modal">
    <h2>完整归档帖子</h2>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px;">
      将自动抓取帖子全部内容：文字、图片、评论，并下载到本地。即使帖子被删也能完整查看。
    </p>
    <div class="form-group">
      <label>小红书帖子链接</label>
      <input type="text" id="archiveUrl" placeholder="粘贴小红书分享链接...">
    </div>
    <div class="progress-bar" id="archiveProgress">
      <div class="progress-fill" id="archiveProgressFill" style="width:0%"></div>
      <div class="progress-text" id="archiveProgressText"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModals()">取消</button>
      <button class="btn btn-success" id="archiveBtn" onclick="archivePost()">开始归档</button>
    </div>
  </div>
</div>

<!-- 手动添加弹窗 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>手动添加帖子</h2>
    <div class="form-group">
      <label>标题 *</label>
      <input type="text" id="addTitle" placeholder="帖子标题">
    </div>
    <div class="form-group">
      <label>作者</label>
      <input type="text" id="addAuthor" placeholder="作者昵称">
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="addContent" placeholder="帖子完整内容"></textarea>
    </div>
    <div class="form-group">
      <label>链接 (可选)</label>
      <input type="text" id="addUrl" placeholder="帖子原始链接">
    </div>
    <div class="form-group">
      <label>标签 (逗号分隔)</label>
      <input type="text" id="addTags" placeholder="美食, 旅行, 穿搭">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModals()">取消</button>
      <button class="btn btn-primary" onclick="addPost()">添加</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay detail-modal" id="detailModal">
  <div class="modal" id="detailContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  let allPosts = [];

  async function loadPosts(query) {
    const url = query ? `/api/posts?q=${encodeURIComponent(query)}` : '/api/posts';
    const res = await fetch(url);
    const json = await res.json();
    if (json.success) {
      allPosts = json.data;
      renderPosts(allPosts);
      document.getElementById('totalCount').textContent = json.total;
      document.getElementById('archivedCount').textContent = json.data.filter(p => p.archived).length;
    }
  }

  function getImageSrc(img) {
    // 优先使用本地路径
    if (img.localPath) return '/' + img.localPath;
    return img.url || '';
  }

  function renderPosts(posts) {
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');

    if (posts.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    list.innerHTML = posts.map(post => {
      const firstImg = post.images && post.images.length > 0 ? post.images[0] : null;
      const imgHtml = firstImg
        ? `<img class="card-image" src="${escapeHtml(getImageSrc(firstImg))}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'card-image placeholder\\'>&#128247;</div>'">`
        : `<div class="card-image placeholder">${post.video ? '&#127916;' : '&#128221;'}</div>`;

      const tagsHtml = (post.tags || []).slice(0, 3).map(t =>
        `<span class="tag">#${escapeHtml(t)}</span>`
      ).join('');

      const archiveBadge = post.archived
        ? `<span class="badge-archived">已归档</span>`
        : '';

      const commentCount = (post.commentList || []).length;

      return `
        <div class="card" onclick="showDetail('${escapeHtml(post.noteId)}')">
          ${imgHtml}
          <div class="card-body">
            <div class="card-title">${escapeHtml(post.title)} ${archiveBadge}</div>
            <div class="card-meta">
              <span class="card-author">${escapeHtml(post.author || '未知')}</span>
              <span>
                &#10084; ${formatNum(post.likes)}
                ${commentCount ? `&#128172; ${commentCount}` : ''}
              </span>
            </div>
          </div>
          ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
          <div class="card-actions">
            ${post.snapshotPath ? `<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();window.open('/${escapeHtml(post.snapshotPath)}','_blank')">离线快照</button>` : ''}
            <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();deletePost('${escapeHtml(post.noteId)}')">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function showDetail(noteId) {
    const res = await fetch(`/api/posts/${noteId}`);
    const json = await res.json();
    if (!json.success) return;

    const post = json.data;

    const imagesHtml = (post.images || []).map(img =>
      `<img src="${escapeHtml(getImageSrc(img))}" alt="" loading="lazy" onerror="this.style.display='none'">`
    ).join('');

    let videoHtml = '';
    if (post.video) {
      const videoSrc = post.video.localPath ? `/${post.video.localPath}` : post.video.url;
      if (videoSrc) {
        videoHtml = `<video controls style="max-width:100%;border-radius:8px;margin-bottom:12px;" src="${escapeHtml(videoSrc)}"></video>`;
      }
    }

    const tagsHtml = (post.tags || []).map(t =>
      `<span class="tag">#${escapeHtml(t)}</span>`
    ).join('');

    // 评论区
    const comments = post.commentList || [];
    let commentsHtml = '';
    if (comments.length > 0) {
      const commentItems = comments.map(c => {
        const subHtml = (c.subComments || []).map(sc => `
          <div class="sub-comment">
            <span class="comment-author">${escapeHtml(sc.author)}</span>
            <span class="comment-time">${sc.createTime ? new Date(sc.createTime).toLocaleString('zh-CN') : ''}</span>
            <div class="comment-content">${escapeHtml(sc.content)}</div>
          </div>
        `).join('');

        return `
          <div class="comment-item">
            <span class="comment-author">${escapeHtml(c.author)}</span>
            <span class="comment-time">${c.createTime ? new Date(c.createTime).toLocaleString('zh-CN') : ''}</span>
            ${c.likes ? `<span class="comment-likes">&#10084; ${c.likes}</span>` : ''}
            <div class="comment-content">${escapeHtml(c.content)}</div>
            ${subHtml}
          </div>
        `;
      }).join('');

      commentsHtml = `
        <div class="comments-section">
          <div class="comments-title">评论 (${comments.length})</div>
          ${commentItems}
        </div>
      `;
    }

    const archiveStatus = post.archived
      ? `<span class="badge-archived" style="font-size:12px;padding:2px 10px;">已完整归档</span>`
      : `<span style="color:var(--text-light);font-size:12px;">未归档 (仅保存元数据)</span>`;

    document.getElementById('detailContent').innerHTML = `
      <div class="detail-title">${escapeHtml(post.title)}</div>
      <div class="detail-author">
        ${escapeHtml(post.author || '未知')}
        ${post.publishTime ? ` &middot; ${escapeHtml(post.publishTime)}` : ''}
        ${post.savedAt ? ` &middot; 保存于 ${new Date(post.savedAt).toLocaleDateString('zh-CN')}` : ''}
        &nbsp; ${archiveStatus}
      </div>
      <div class="detail-content">${escapeHtml(post.content || '(无内容)')}</div>
      ${videoHtml}
      ${imagesHtml ? `<div class="detail-images">${imagesHtml}</div>` : ''}
      <div class="detail-stats">
        <span>&#10084; ${formatNum(post.likes)} 点赞</span>
        <span>&#9733; ${formatNum(post.collects)} 收藏</span>
        <span>&#128172; ${formatNum(post.comments)} 评论</span>
        <span>&#128247; ${(post.images||[]).length} 张图片${(post.images||[]).some(i=>i.localPath) ? ' (已下载)' : ''}</span>
      </div>
      ${tagsHtml ? `<div class="detail-tags">${tagsHtml}</div>` : ''}
      ${commentsHtml}
      <div class="modal-actions">
        ${post.snapshotPath ? `<button class="btn btn-outline" onclick="window.open('/${escapeHtml(post.snapshotPath)}','_blank')">打开离线快照</button>` : ''}
        ${post.url ? `<button class="btn btn-outline" onclick="window.open('${escapeHtml(post.url)}','_blank')">原文</button>` : ''}
        <button class="btn btn-outline" onclick="deletePost('${escapeHtml(post.noteId)}');closeModals()">删除</button>
        <button class="btn btn-primary" onclick="closeModals()">关闭</button>
      </div>
    `;

    document.getElementById('detailModal').classList.add('active');
  }

  // 完整归档
  async function archivePost() {
    const url = document.getElementById('archiveUrl').value.trim();
    if (!url) return showToast('请输入链接');

    const btn = document.getElementById('archiveBtn');
    const progress = document.getElementById('archiveProgress');
    const progressFill = document.getElementById('archiveProgressFill');
    const progressText = document.getElementById('archiveProgressText');

    btn.textContent = '归档中...';
    btn.disabled = true;
    progress.classList.add('active');
    progressFill.style.width = '20%';
    progressText.textContent = '正在抓取帖子...';

    try {
      progressFill.style.width = '40%';
      progressText.textContent = '正在下载图片和评论...';

      const res = await fetch('/api/posts/archive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      progressFill.style.width = '90%';
      progressText.textContent = '正在保存...';

      const json = await res.json();
      if (json.success) {
        progressFill.style.width = '100%';
        progressText.textContent = '归档完成!';
        const p = json.data;
        const imgCount = (p.images||[]).filter(i=>i.localPath).length;
        const commentCount = (p.commentList||[]).length;
        showToast(`归档成功! ${imgCount} 张图片, ${commentCount} 条评论`);
        setTimeout(() => {
          closeModals();
          loadPosts();
        }, 800);
      } else {
        showToast('归档失败: ' + json.error);
      }
    } catch (e) {
      showToast('网络错误: ' + e.message);
    } finally {
      btn.textContent = '开始归档';
      btn.disabled = false;
      setTimeout(() => {
        progress.classList.remove('active');
        progressFill.style.width = '0%';
      }, 1500);
    }
  }

  async function addPost() {
    const title = document.getElementById('addTitle').value.trim();
    if (!title) return showToast('请输入标题');

    const data = {
      title,
      author: document.getElementById('addAuthor').value.trim(),
      content: document.getElementById('addContent').value.trim(),
      url: document.getElementById('addUrl').value.trim(),
      tags: document.getElementById('addTags').value.trim(),
    };

    try {
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (json.success) {
        showToast('添加成功!');
        closeModals();
        loadPosts();
        ['addTitle','addAuthor','addContent','addUrl','addTags'].forEach(id => document.getElementById(id).value = '');
      } else {
        showToast('添加失败: ' + json.error);
      }
    } catch (e) {
      showToast('网络错误: ' + e.message);
    }
  }

  async function deletePost(noteId) {
    if (!confirm('确定要删除这条帖子吗? 本地图片和快照也将丢失。')) return;
    const res = await fetch(`/api/posts/${noteId}`, { method: 'DELETE' });
    const json = await res.json();
    if (json.success) {
      showToast('已删除');
      loadPosts();
    }
  }

  function openArchiveModal() {
    document.getElementById('archiveUrl').value = '';
    document.getElementById('archiveProgress').classList.remove('active');
    document.getElementById('archiveModal').classList.add('active');
  }

  function openAddModal() {
    document.getElementById('addModal').classList.add('active');
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
  }

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModals();
    });
  });

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadPosts(e.target.value.trim()), 300);
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatNum(n) {
    if (!n) return '0';
    if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadPosts();
</script>

</body>
